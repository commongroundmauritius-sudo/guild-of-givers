name: CI Format

on:
  pull_request:
    branches:
      - main
      - production-readiness-finalization
    paths:
      - "scripts/security-audit.mjs"
      - "src/integrations/supabase/types.ts"
      - "src/lib/crm/supporter-service.ts"
      - "src/lib/partner/service.ts"
      - ".prettierrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: ci-format-production-readiness
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Format CI-blocking files
        run: npx prettier --write scripts/security-audit.mjs src/integrations/supabase/types.ts src/lib/crm/supporter-service.ts src/lib/partner/service.ts

      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security-audit.mjs src/integrations/supabase/types.ts src/lib/crm/supporter-service.ts src/lib/partner/service.ts
          git commit -m "style: apply project Prettier formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
