name: Production Validation

on:
  push:
    branches:
      - main
      - production-readiness-finalization
  pull_request:
    branches:
      - main
      - production-readiness-finalization

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Format sources
        run: npx prettier --write src scripts

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify worker output
        run: |
          test -f dist/client/_worker.js
          test -f dist/client/wrangler.json
          grep -q '"main": "_worker.js"' dist/client/wrangler.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start production worker preview
        run: |
          cd dist/client
          npx wrangler dev --config wrangler.json --local --ip 0.0.0.0 --port 8080 > /tmp/preview.log 2>&1 &

      - name: Wait for preview
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/preview.log
          exit 1

      - name: E2E — admin
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/admin.spec.ts

      - name: E2E — auth
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/auth.spec.ts

      - name: E2E — compliance and cookies
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/compliance-cookie-consent.spec.ts

      - name: E2E — signup journey
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/e2e-signup-journey.spec.ts

      - name: E2E — financial trace
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/financial-trace.spec.ts

      - name: E2E — member checkpoint
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/member-checkpoint.spec.ts

      - name: E2E — member
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/member.spec.ts

      - name: E2E — partner security
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/partner-security.spec.ts

      - name: E2E — smoke
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/smoke.spec.ts

      - name: E2E — system
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/system.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
