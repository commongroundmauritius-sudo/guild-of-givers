name: Production Validation
run-name: Production validation (${{ github.sha }})

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - production-readiness-finalization
  pull_request:
    branches:
      - main
      - production-readiness-finalization

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Format sources
        run: npx prettier --write src scripts tests

      - name: Lint
        run: npm run lint

      - name: Production build (mock payments disabled)
        env:
          VITE_ENABLE_MOCK_PAYMENTS: "false"
        run: npm run build

      - name: Verify production worker output
        run: |
          test -f dist/client/_worker.js
          test -f dist/client/wrangler.json
          grep -q '"main": "_worker.js"' dist/client/wrangler.json

      - name: Test build (mock payments enabled)
        env:
          VITE_ENABLE_MOCK_PAYMENTS: "true"
        run: npm run build

      - name: Verify test worker output
        run: |
          test -f dist/client/_worker.js
          test -f dist/client/wrangler.json
          grep -q '"main": "_worker.js"' dist/client/wrangler.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start production worker preview
        env:
          VITE_ENABLE_MOCK_PAYMENTS: "true"
        run: |
          ./node_modules/.bin/wrangler pages dev dist/client --config wrangler.json --ip 127.0.0.1 --port 8080 --log-level debug --show-interactive-dev-session=false --persist-to /tmp/wrangler-state > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          echo "$PREVIEW_PID" > /tmp/preview.pid
          sleep 3
          if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
            echo "ERROR: Wrangler Pages preview process exited before binding to port 8080."
            echo "===== Wrangler log ====="
            cat /tmp/preview.log
            exit 1
          fi
          echo "Wrangler Pages preview process started with PID $PREVIEW_PID."
          echo "===== Initial Wrangler log ====="
          cat /tmp/preview.log || true

      - name: Wait for preview
        run: |
          for i in {1..60}; do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/ >/dev/null; then
              echo "Preview is reachable on 127.0.0.1:8080."
              exit 0
            fi

            if [ -f /tmp/preview.pid ] && ! kill -0 "$(cat /tmp/preview.pid)" 2>/dev/null; then
              echo "ERROR: Wrangler Pages preview process exited while waiting for port 8080."
              echo "===== Wrangler log ====="
              cat /tmp/preview.log
              exit 1
            fi

            if [ "$i" -eq 1 ] || [ "$i" -eq 5 ] || [ "$i" -eq 10 ] || [ "$i" -eq 30 ] || [ "$i" -eq 60 ]; then
              echo "Preview still not reachable after $((i * 2)) seconds."
              echo "===== Wrangler log ====="
              cat /tmp/preview.log || true
              echo "===== Listening ports ====="
              ss -lntp || true
            fi

            sleep 2
          done

          echo "ERROR: Preview did not become reachable on 127.0.0.1:8080."
          echo "===== Wrangler log ====="
          cat /tmp/preview.log || true
          echo "===== Listening ports ====="
          ss -lntp || true
          if [ -f /tmp/preview.pid ]; then
            kill "$(cat /tmp/preview.pid)" 2>/dev/null || true
          fi
          exit 1

      - name: E2E — admin
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/admin.spec.ts

      - name: E2E — auth
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/auth.spec.ts

      - name: E2E — compliance and cookies
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/compliance-cookie-consent.spec.ts

      - name: E2E — signup journey
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/e2e-signup-journey.spec.ts

      - name: E2E — financial trace
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/financial-trace.spec.ts

      - name: E2E — member checkpoint
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/member-checkpoint.spec.ts

      - name: E2E — member
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/member.spec.ts

      - name: E2E — partner security
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/partner-security.spec.ts

      - name: E2E — smoke
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/smoke.spec.ts

      - name: E2E — system
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/system.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
