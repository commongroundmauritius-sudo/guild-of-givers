name: Security Audit

on:
  push:
    branches:
      - main
      - production-readiness-finalization
  pull_request:
    branches:
      - main
      - production-readiness-finalization

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static security audit
        run: node scripts/security-audit.mjs
