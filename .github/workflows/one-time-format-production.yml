name: One-time production formatting

on:
  workflow_dispatch:
  push:
    branches:
      - production-readiness-finalization
    paths:
      - src/routes/signup.tsx

permissions:
  contents: write

concurrency:
  group: one-time-production-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx prettier --write src/routes/signup.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/routes/signup.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/signup.tsx
          git commit -m "style: format signup flow"
          git push origin HEAD:production-readiness-finalization
