name: Infrastructure Guard

on:
  pull_request:
    paths:
      - "vite.config.ts"
      - "scripts/build-worker.js"
      - "package.json"
      - "supabase/migrations/**"
      - ".github/workflows/**"

jobs:
  verify-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify TanStack Start configuration
        run: |
          grep -q 'entry: "server"' vite.config.ts || (echo 'ERROR: vite.config.ts missing TanStack Start server entry' && false)

      - name: Build and Validate Worker
        run: npm run build

      - name: Detect Infrastructure Drift
        run: |
          test -f dist/client/_worker.js || (echo 'ERROR: _worker.js missing' && false)
          grep -q '"main": "_worker.js"' dist/client/wrangler.json || (echo 'ERROR: wrangler.json mismatch' && false)
          grep -q '"nodejs_compat"' dist/client/wrangler.json || (echo 'ERROR: wrangler.json missing nodejs_compat' && false)
          grep -Eq 'export[[:space:]]+default|as[[:space:]]+default' dist/client/_worker.js || (echo 'ERROR: worker default export missing' && false)
